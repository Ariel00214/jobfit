services:
  - type: web
    name: jobfit
    runtime: python
    region: singapore
    plan: free
    buildCommand: bash build.sh
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional. When absent, URL parsing skips web search and continues with
      # Playwright / OCR / manual text without preventing service startup.
      - key: BRAVE_SEARCH_API_KEY
        sync: false

